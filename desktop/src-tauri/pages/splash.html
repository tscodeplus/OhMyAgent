<!DOCTYPE html>
<!-- Splash shown while the sidecar boots — same look as the Electron splash
     (desktop/src/main.ts:createSplashHtml). Loaded as a static resource via
     the App URL: data: URLs are unreliable on WKWebView (charset detection,
     plain-text rendering — wry dropped native data: URL support in 0.37).
     The label is localized in-page from navigator.language. -->
<html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;
  }
  /* The gradient lives on an inner card that clips at its own border-radius;
     the <body> around it stays transparent so the corners show the desktop.
     Windows only gets true per-pixel alpha once the window runs with
     WS_EX_NOREDIRECTIONBITMAP (enable_per_pixel_alpha in windows.rs) —
     without it WebView2 composites over an opaque redirection surface and the
     corners show the webview's default background instead of the desktop.
     macOS handles the transparent corners natively. */
  .card{
    width:100%;height:100%;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding-top:18px;
    background:linear-gradient(135deg,#6366f1,#4f46e5);
    color:#fff;border-radius:12px;overflow:hidden;
  }
  .logo{width:52px;height:52px;margin-bottom:20px;background:rgba(255,255,255,.15);border-radius:14px;display:flex;align-items:center;justify-content:center}
  .spin-o{width:28px;height:28px;border:3.5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
  .text{font-size:17px;font-weight:600;letter-spacing:1px;text-align:center;padding:0 24px;opacity:.9}
  @keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
  <div class="card">
    <div class="logo"><div class="spin-o"></div></div>
    <div class="text" id="text">OhMyAgent Starting…</div>
  </div>
  <script>
    if (navigator.language && navigator.language.toLowerCase().startsWith('zh')) {
      document.getElementById('text').textContent = 'OhMyAgent 启动中…';
    }
  </script>
</body></html>
