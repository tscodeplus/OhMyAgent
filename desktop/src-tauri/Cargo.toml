[package]
name = "ohmyagent-desktop"
version = "2.1.0-beta1"
description = "OhMyAgent Desktop — Tauri shell for local and remote Agent Gateway"
authors = ["tscodeplus"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ohmyagent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization", "Win32_System_Time"] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "devtools", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
log = "0.4"
