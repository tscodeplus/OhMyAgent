[package]
name = "ohmyagent-desktop"
version = "2.3.0-beta3"
description = "OhMyAgent Desktop — Tauri shell for local and remote Agent Gateway"
authors = ["tscodeplus"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ohmyagent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
# Win32_Graphics_Dwm: DwmSetWindowAttribute (title-bar color in dark mode);
# Win32_Graphics_Gdi: GetSysColor (restore default caption colors);
# Win32_System_Registry: AppsUseLightTheme (OS dark-mode detection);
# Win32_System_JobObjects: kill-on-close job for the sidecar (uninstaller
#   / crash / quit orphan cleanup — the OS terminates the child with the shell);
#   its CreateJobObjectW needs Win32_Security (SECURITY_ATTRIBUTES param) and
#   JOBOBJECT_EXTENDED_LIMIT_INFORMATION needs Win32_System_Threading.
windows-sys = { version = "0.59", features = ["Win32_Globalization", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading"] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "devtools", "image-png", "macos-private-api", "webview-data-url"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
log = "0.4"
