<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bg)"/>
  <!-- The O as a ring of two circles (fill-rule evenodd): pure geometry so
       the letter is visually centered on every platform. The previous
       <text> element relied on font baseline math (dy=.35em), which renders
       the O too high on macOS. Outer diameter 420 (the old 580px font's
       cap-height ≈ 418) keeps the O the same size as the Electron icon. -->
  <path fill="white" fill-rule="evenodd"
        d="M512 302 a210 210 0 1 1 0 420 a210 210 0 1 1 0 -420
           M512 374 a138 138 0 1 0 0 276 a138 138 0 1 0 0 -276"/>
</svg>
