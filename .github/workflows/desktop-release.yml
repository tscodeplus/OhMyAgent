name: Desktop Release

# Single-workflow release pipeline (the Electron-era orchestration, restored
# for the Tauri build): a tag push runs the build matrix (Windows NSIS,
# macOS x64+arm64 dmg/zip, Linux deb) and create-release runs only AFTER all
# builds finish, attaching every installer in one `gh release create` call.
# The release is born with its full asset list, so GitHub's release
# notification email shows all installers — not just the auto-generated
# source archives that an empty, publish-first release carries.
#
# The previous split (desktop-windows/mac/linux.yml triggering on
# release:published and attaching later) was removed: it published an empty
# release on tag push, then attached artifacts after the email already went
# out (and the release event sometimes never fired at all).
#
# workflow_dispatch builds the matrix without creating a release
# (artifact-only, for validating a commit before tagging).

on:
  push:
    tags:
      - 'v*'          # Trigger on version tags: v0.2.0, v0.2.0-beta.1, etc.
  workflow_dispatch:   # Manual trigger from GitHub UI — build only, no release
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write      # create-release deletes/creates the GitHub Release

env:
  OMA_TARGET_PLATFORM_PLACEHOLDER: ''

jobs:
  # ------------------------------------------------------------------
  # Detect release type (prerelease vs stable) from tag name
  # ------------------------------------------------------------------
  detect-release-type:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release_type.outputs.prerelease }}
    steps:
      - name: Detect release type
        id: release_type
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
              echo "prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "prerelease=false" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.ref_name }}" =~ -(beta|rc|alpha|pre) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

  # ------------------------------------------------------------------
  # Build — one job per target, in parallel (merged from the removed
  # desktop-windows.yml / desktop-mac.yml / desktop-linux.yml so that
  # create-release can attach every artifact in one shot before the
  # release is published).
  # ------------------------------------------------------------------
  build:
    needs: detect-release-type
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: NSIS installer + latest.yml (host-default rust target).
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_platform: win32-x64
            cache_key: win-x64
            artifact_suffix: ''
          # macOS: no universal fat binaries — one job per native arch.
          # macos-14/15 are arm64 runners — pnpm there installs only
          # darwin-arm64 native modules (sharp/@img etc.), so the x64 job
          # MUST run on the Intel runner or bundle-deps fails ("sharp: no
          # native files found" — darwin-x64 was never installed).
          # artifact_suffix keeps the Release asset names identical to the
          # Electron-era naming: x64 = OhMyAgent-<v>.dmg / OhMyAgent-<v>-mac.zip,
          # arm64 = OhMyAgent-<v>-arm64.dmg / OhMyAgent-<v>-arm64-mac.zip.
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle_platform: darwin-x64
            cache_key: x86_64-apple-darwin
            artifact_suffix: ''
          - runner: macos-14
            target: aarch64-apple-darwin
            bundle_platform: darwin-arm64
            cache_key: aarch64-apple-darwin
            artifact_suffix: '-arm64'
          # Linux: deb only (tauri's cached linuxdeploy throws on Ubuntu 24.04).
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle_platform: linux-x64
            cache_key: linux-x64
            artifact_suffix: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node (matches bundled runtime)
        uses: actions/setup-node@v4
        with:
          node-version-file: desktop/.node-version
          cache: pnpm

      # Same rustc everywhere (matches the Windows build machine) — a bump
      # invalidates every crate's fingerprint and turns the cargo cache below
      # into a full recompile, so it is pinned explicitly.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.target }}

      # Every run starts from a clean VM — without this the ~300-crate tauri
      # dep tree recompiles from scratch each time. Cache cargo registry +
      # toolchain + the release target dir; the key is stable across version
      # bumps (Cargo.lock unchanged). matrix.cache_key matches the old split
      # workflows' keys (cargo-win-x64-, cargo-<target>-, cargo-linux-x64-),
      # so the existing CI caches are reused.
      - name: Cache cargo (registry + toolchain + build artifacts)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            desktop/src-tauri/target
          key: cargo-${{ matrix.cache_key }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.cache_key }}-

      # fetch-node.cjs skips the ~27MB archive download when the binary
      # already exists — give it a persistent home so the download happens
      # once per .node-version, not once per run.
      - name: Cache bundled Node runtime
        uses: actions/cache@v4
        with:
          path: desktop/.sidecar-deps/runtime
          key: node-${{ matrix.bundle_platform }}-${{ hashFiles('desktop/.node-version') }}

      # Tauri 2 system dependencies (WebKitGTK 4.1). libfuse2 is needed to
      # run appimagetool; gdk-pixbuf loaders and squashfs-tools/patchelf are
      # required by linuxdeploy's AppImage step.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            librsvg2-common \
            libgdk-pixbuf2.0-bin \
            squashfs-tools \
            patchelf \
            libfuse2 \
            fakeroot \
            dpkg-dev
          # Refresh the gdk-pixbuf loader cache linuxdeploy queries.
          gdk-pixbuf-query-loaders --update-cache || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WebUI
        run: cd ui && pnpm install --frozen-lockfile && pnpm build

      - name: Build server (root TS)
        run: pnpm build

      # bundle-deps / fetch-node default to win32-x64 (the host platform);
      # the matrix platform must be passed via env (a VAR=value prefix is
      # bash syntax — the Windows runner's default shell is PowerShell).
      - name: Bundle sidecar deps
        run: cd desktop && node scripts/bundle-deps.cjs
        env:
          OMA_TARGET_PLATFORM: ${{ matrix.bundle_platform }}

      - name: Fetch bundled Node runtime
        run: cd desktop && node scripts/fetch-node.cjs
        env:
          OMA_TARGET_PLATFORM: ${{ matrix.bundle_platform }}

      - name: Check version consistency (root / desktop / tauri.conf.json)
        run: |
          node -e "const r=require('./package.json').version,d=require('./desktop/package.json').version,t=require('./desktop/src-tauri/tauri.conf.json').version;if(r!==d||r!==t){console.error('Version mismatch: root='+r+' desktop='+d+' tauri.conf='+t);process.exit(1)}console.log('Versions consistent: '+r)"

      # Signing secrets are OPTIONAL. Never set the env vars to empty
      # strings: tauri's codesign sees APPLE_CERTIFICATE set (even empty)
      # and runs `security import` on an empty file → build fails.
      - name: Configure signing env (macOS only, when secrets exist)
        if: runner.os == 'macOS'
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_API_KEY }}" ]; then
            echo "APPLE_API_KEY=${{ secrets.APPLE_API_KEY }}" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=${{ secrets.APPLE_API_KEY_ID }}" >> "$GITHUB_ENV"
          fi

      - name: Build Tauri app (NSIS installer)
        if: runner.os == 'Windows'
        timeout-minutes: 90
        run: cd desktop && npx tauri build --bundles nsis

      - name: Build Tauri app (macOS .app bundle)
        if: runner.os == 'macOS'
        # Timeout so a hung build fails fast and its full log becomes
        # downloadable. 90 min: the Intel runner is ~2x slower than arm64 at
        # the first (uncached) tauri compile; the cargo cache above turns
        # subsequent runs into mostly-link+package steps. dmg is NOT built
        # here — tauri's bundler drives Finder via AppleScript (TCC
        # automation grant), which hangs ~3 min then fails on headless
        # runners. The next step packages the dmg with hdiutil.
        timeout-minutes: 90
        run: cd desktop && npm run tauri:build:mac
        env:
          # beforeBuildCommand re-runs bundle-deps; keep the platform pruning
          # aligned with this job's target (default would be win32-x64).
          OMA_TARGET_PLATFORM: ${{ matrix.bundle_platform }}

      - name: Build Tauri app (Linux deb)
        if: runner.os == 'Linux'
        # deb only: tauri's cached linuxdeploy (2024-07-26 build) throws
        # std::runtime_error while deploying gdk-pixbuf on Ubuntu 24.04, so
        # the AppImage step always fails. Revisit with a newer linuxdeploy in
        # the tauri tools cache (~/.cache/tauri/linuxdeploy-x86_64.AppImage).
        run: cd desktop && npx tauri build -v --bundles deb
        env:
          # beforeBuildCommand re-runs bundle-deps; keep the platform pruning
          # aligned with this job's target (default would be win32-x64).
          OMA_TARGET_PLATFORM: ${{ matrix.bundle_platform }}

      # tauri has no artifact-name config (removed in v2) — the NSIS file
      # comes out as OhMyAgent_<v>_x64-setup.exe. Rename to the Electron-era
      # OhMyAgent-Setup-<v>.exe so the updater's latest.yml URL keeps working.
      - name: Rename installer (electron-builder style name)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = node -p "require('./package.json').version"
          $nsisDir = Join-Path $env:GITHUB_WORKSPACE "desktop/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem (Join-Path $nsisDir "OhMyAgent_*_x64-setup.exe") | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found in $nsisDir" }
          # Absolute target path inside the nsis dir — a relative name would
          # land in the workspace root and the upload/attach globs would
          # miss it. Move-Item -Force (not Rename-Item, whose -Force cannot
          # overwrite an existing target) replaces a stale installer that the
          # cached target dir may hold from a previous run (same version).
          Write-Host "renaming $($exe.FullName) -> $nsisDir\OhMyAgent-Setup-$VERSION.exe"
          Move-Item -Force $exe.FullName (Join-Path $nsisDir "OhMyAgent-Setup-$VERSION.exe")
          # Drop stale installers of other versions left by the cargo target
          # cache so the upload glob below ships only the current one.
          # Exact-name match (-ne), not a wildcard: a beta1 build of the same
          # version (OhMyAgent-Setup-2.2.0-beta1.exe) contains "2.2.0" as a
          # substring and would survive -notlike "*2.2.0*".
          Get-ChildItem $nsisDir -Filter "OhMyAgent*.exe" |
            Where-Object { $_.Name -ne "OhMyAgent-Setup-$VERSION.exe" } |
            Remove-Item -Force

      - name: Generate latest.yml metadata
        if: runner.os == 'Windows'
        run: |
          $VERSION = node -p "require('./package.json').version"
          $EXE = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/OhMyAgent-Setup-*.exe" | Select-Object -First 1
          node desktop/scripts/release-meta.cjs $EXE.FullName $VERSION

      - name: Package dmg (hdiutil + prebuilt .DS_Store, no AppleScript)
        if: runner.os == 'macOS'
        # tauri's bundler lays out the dmg (app icon + /Applications drop
        # target) by driving Finder via AppleScript, which needs a TCC
        # automation grant and hangs ~3 min then fails on headless runners.
        # Instead we replicate the Electron (electron-builder) dmg exactly:
        # its prebuilt .DS_Store template (app left, /Applications right,
        # 540x380 centered window) is committed at
        # desktop/scripts/dmg-layout/.DS_Store and copied into the staging
        # dir before hdiutil — no Finder, no extra dependencies.
        # UDBZ (bzip2) instead of UDZO (zlib): bzip2 compresses the ~270 MB
        # .app (mostly JS text + Node binary) noticeably better — measured
        # ~117 MB with UDZO vs ~100 MB with UDBZ. Slightly slower to create;
        # fully supported by macOS for mounting since 10.4.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP="desktop/src-tauri/target/release/bundle/macos/OhMyAgent.app"
          DMG_DIR="desktop/src-tauri/target/release/bundle/dmg"
          DMG="$DMG_DIR/OhMyAgent-${VERSION}${{ matrix.artifact_suffix }}.dmg"
          # The dmg dir accumulates stale files from previous runs via the
          # cargo target cache (bundle_dmg.sh, old-named dmg, icon.icns) —
          # start clean so only the fresh dmg exists.
          rm -rf "$DMG_DIR"
          mkdir -p "$DMG_DIR"
          STAGING="$(mktemp -d)"
          cp -R "$APP" "$STAGING/OhMyAgent.app"
          ln -s /Applications "$STAGING/Applications"
          cp desktop/scripts/dmg-layout/.DS_Store "$STAGING/.DS_Store"
          # hdiutil occasionally fails with "create failed - Resource busy"
          # on GitHub's macOS runners — transient, the same step succeeds on
          # re-run. Retry the create against the same staging dir.
          for attempt in 1 2 3; do
            if hdiutil create -volname "OhMyAgent" -srcfolder "$STAGING" -ov -format UDBZ "$DMG"; then
              break
            fi
            echo "hdiutil create failed (attempt $attempt/3), retrying in 10s..."
            sleep 10
          done
          if [ ! -f "$DMG" ]; then
            echo "hdiutil create failed after 3 attempts"
            exit 1
          fi
          rm -rf "$STAGING"
          ls -lh "$DMG"

      - name: Package zip distribution (ditto, preserves resource forks)
        if: runner.os == 'macOS'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP="desktop/src-tauri/target/release/bundle/macos/OhMyAgent.app"
          ZIP="desktop/src-tauri/target/release/bundle/macos/OhMyAgent-${VERSION}${{ matrix.artifact_suffix }}-mac.zip"
          # Drop stale zips of other versions left by the cargo target cache
          # so the upload glob below ships only the current one.
          rm -f desktop/src-tauri/target/release/bundle/macos/OhMyAgent-*-mac.zip
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          ls -lh "$ZIP"

      - name: Smoke test (launch app binary, check /api/health)
        if: runner.os == 'macOS'
        run: |
          APP="desktop/src-tauri/target/release/bundle/macos/OhMyAgent.app"
          BIN="$APP/Contents/MacOS/ohmyagent-desktop"
          "$BIN" > /tmp/oma-smoke.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 40); do
            if curl -sf -m 2 http://127.0.0.1:9191/api/health > /tmp/oma-health.json; then
              echo "health OK: $(cat /tmp/oma-health.json)"
              kill $APP_PID 2>/dev/null || true
              exit 0
            fi
            sleep 2
          done
          echo "health check failed; app log:"
          tail -40 /tmp/oma-smoke.log
          kill $APP_PID 2>/dev/null || true
          exit 1

      - name: Rename artifacts (electron-builder style names)
        if: runner.os == 'Linux'
        # Rename to the Electron-era asset name (ohmyagent-desktop_<v>_amd64.deb)
        # so the release looks the same as before the Tauri migration.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd desktop/src-tauri/target/release/bundle
          mv -f deb/OhMyAgent_${VERSION}_amd64.deb "deb/ohmyagent-desktop_${VERSION}_amd64.deb"
          # Drop stale debs of other versions left by the cargo target cache
          # so the upload glob below ships only the current one. Purge both
          # name forms — old builds ship as OhMyAgent_*.deb, and a stale
          # ohmyagent-desktop_*.deb (same-name prefix) would slip past a
          # single-prefix glob.
          rm -f deb/OhMyAgent_*.deb deb/ohmyagent-desktop_*.deb

      - name: Generate latest-linux.yml metadata
        if: runner.os == 'Linux'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DEB=$(ls desktop/src-tauri/target/release/bundle/deb/*.deb | head -1)
          node desktop/scripts/release-meta.cjs "$DEB" "$VERSION" latest-linux.yml

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ohmyagent-windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/OhMyAgent-Setup-*.exe
            desktop/src-tauri/target/release/bundle/nsis/latest.yml
          if-no-files-found: error

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ohmyagent-mac-${{ matrix.bundle_platform }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/OhMyAgent-*${{ matrix.artifact_suffix }}.dmg
            desktop/src-tauri/target/release/bundle/macos/OhMyAgent-*${{ matrix.artifact_suffix }}-mac.zip
          if-no-files-found: error

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ohmyagent-linux-x64
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/deb/latest-linux.yml
          if-no-files-found: error

  # Merge the per-arch zip entries into a single latest-mac.yml so the mac
  # updater can pick its own architecture (selectUpdateFile in updater.ts).
  # Builds the yml from the two artifacts and hands it to create-release —
  # the ONLY yml attachment for macOS, which also fixes the old "later job
  # overwrites the other arch's yml" bug.
  mac-meta:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ohmyagent-mac-darwin-x64
          path: mac-x64

      - uses: actions/download-artifact@v4
        with:
          name: ohmyagent-mac-darwin-arm64
          path: mac-arm64

      - name: Generate merged latest-mac.yml (x64 + arm64)
        # upload-artifact stores both globs relative to their least common
        # ancestor (desktop/src-tauri/target/release/bundle), so inside the
        # artifact the files live at dmg/ and macos/ — no bundle/ prefix.
        # The yml is written next to the first zip (mac-x64/macos/).
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP_X64=$(ls mac-x64/macos/OhMyAgent-*-mac.zip | head -1)
          ZIP_ARM64=$(ls mac-arm64/macos/OhMyAgent-*-arm64-mac.zip | head -1)
          if [ -z "$ZIP_X64" ] || [ -z "$ZIP_ARM64" ]; then
            echo "missing zip: x64='$ZIP_X64' arm64='$ZIP_ARM64'"
            exit 1
          fi
          node desktop/scripts/release-meta.cjs "$ZIP_X64" "$ZIP_ARM64" "$VERSION" latest-mac.yml

      - name: Upload merged latest-mac.yml
        uses: actions/upload-artifact@v4
        with:
          name: ohmyagent-mac-meta
          path: mac-x64/macos/latest-mac.yml
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Create Release — runs ONLY after every build finished, and attaches
  # all installers + updater metadata in one `gh release create` call,
  # so the release notification email lists every asset.
  # ------------------------------------------------------------------
  create-release:
    needs: [detect-release-type, build, mac-meta]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')   # tag push only, not workflow_dispatch
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: ohmyagent-windows-x64
          path: release-artifacts/windows

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: ohmyagent-mac-darwin-x64
          path: release-artifacts/mac-x64

      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: ohmyagent-mac-darwin-arm64
          path: release-artifacts/mac-arm64

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: ohmyagent-linux-x64
          path: release-artifacts/linux

      - name: Download merged latest-mac.yml
        uses: actions/download-artifact@v4
        with:
          name: ohmyagent-mac-meta
          path: release-artifacts/mac-meta

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ needs.detect-release-type.outputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # Collect every installer + updater yml from the downloaded
          # artifacts. find (not a glob): the artifact-internal directory
          # depth differs per platform (nsis/ vs dmg/ + macos/ vs deb/).
          ASSETS=()
          while IFS= read -r -d '' f; do
            [[ "$(basename "$f")" == "builder-debug.yml" ]] && continue
            ASSETS+=("$f")
          done < <(find release-artifacts -type f -print0)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "no release assets collected under release-artifacts/"
            exit 1
          fi
          NOTES_FILE="docs/release-notes/${{ github.ref_name }}.md"
          # Delete existing release if re-running (tag already has one)
          gh release delete "${{ github.ref_name }}" --yes --cleanup-tag 2>/dev/null || true
          if [[ -f "$NOTES_FILE" ]]; then
            gh release create "${{ github.ref_name }}" \
              --title "OhMyAgent Desktop ${{ github.ref_name }}" \
              --notes-file "$NOTES_FILE" \
              $PRERELEASE_FLAG \
              --draft=false \
              "${ASSETS[@]}"
          else
            gh release create "${{ github.ref_name }}" \
              --title "OhMyAgent Desktop ${{ github.ref_name }}" \
              --generate-notes \
              $PRERELEASE_FLAG \
              --draft=false \
              "${ASSETS[@]}"
          fi
