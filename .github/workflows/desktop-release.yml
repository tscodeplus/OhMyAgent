name: Desktop Release

# Creates the GitHub Release for a version tag. Actual builds are done by
# desktop-windows.yml and desktop-mac.yml, which trigger on `release: published`
# and attach their artifacts (NSIS installer / dmg / latest.yml) to this release.
# (The old Electron build job was removed in the Tauri 2 migration.)

on:
  push:
    tags:
      - 'v*'          # Trigger on version tags: v0.2.0, v0.2.0-beta.1, etc.
  workflow_dispatch:   # Manual trigger from GitHub UI
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write      # Required for creating GitHub Releases

jobs:
  # ------------------------------------------------------------------
  # Detect release type (prerelease vs stable) from tag name
  # ------------------------------------------------------------------
  detect-release-type:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release_type.outputs.prerelease }}
    steps:
      - name: Detect release type
        id: release_type
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
              echo "prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "prerelease=false" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.ref_name }}" =~ -(beta|rc|alpha|pre) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

  # ------------------------------------------------------------------
  # Create Release — tag push only (not workflow_dispatch).
  # Publishes immediately so the Tauri build workflows (desktop-mac.yml,
  # desktop-windows.yml) are triggered via `release: published` and attach
  # their installers to this release.
  # ------------------------------------------------------------------
  create-release:
    needs: detect-release-type
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ needs.detect-release-type.outputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          NOTES_FILE="docs/release-notes/${{ github.ref_name }}.md"
          # Delete existing release if re-running (tag already has one)
          gh release delete "${{ github.ref_name }}" --yes --cleanup-tag 2>/dev/null || true
          if [[ -f "$NOTES_FILE" ]]; then
            gh release create "${{ github.ref_name }}" \
              --title "OhMyAgent Desktop ${{ github.ref_name }}" \
              --notes-file "$NOTES_FILE" \
              $PRERELEASE_FLAG \
              --draft=false \
              --repo tscodeplus/OhMyAgent
          else
            gh release create "${{ github.ref_name }}" \
              --title "OhMyAgent Desktop ${{ github.ref_name }}" \
              --generate-notes \
              $PRERELEASE_FLAG \
              --draft=false \
              --repo tscodeplus/OhMyAgent
          fi
