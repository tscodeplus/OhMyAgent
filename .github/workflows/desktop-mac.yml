# Desktop macOS build — GitHub Actions CI (macOS has no cross-compile from WSL).
#
# Two independent jobs (native arch each, no universal fat binaries):
#   · macos-13 → x64 (dmg + zip)
#   · macos-14 → arm64 (dmg + zip)
#
# Signing/notarization is optional: with the Apple secrets set the app is
# signed and notarized; without them an unsigned build is produced (Gatekeeper
# will warn users; release notes should mention right-click → Open).
#
# Trigger: manual (workflow_dispatch) or when a release is published.

name: desktop-mac

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to attach release assets to (e.g. 2.1.0-beta1). Leave empty for artifact-only build.'
        required: false
  release:
    types: [published]

# The repo default is read-only; the release attach step needs to upload
# assets and update the release (same as the old Electron desktop-release.yml).
permissions:
  contents: write

env:
  OMA_TARGET_PLATFORM_PLACEHOLDER: ''

jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14/15 are arm64 runners — pnpm there installs only
          # darwin-arm64 native modules (sharp/@img etc.), so the x64 job
          # MUST run on the Intel runner or bundle-deps fails ("sharp: no
          # native files found" — darwin-x64 was never installed).
          # artifact_suffix keeps the Release asset names identical to the
          # Electron-era naming (v2.0.1-beta1): x64 = OhMyAgent-<v>.dmg /
          # OhMyAgent-<v>-mac.zip, arm64 = OhMyAgent-<v>-arm64.dmg /
          # OhMyAgent-<v>-arm64-mac.zip.
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle_platform: darwin-x64
            artifact_suffix: ''
          - runner: macos-14
            target: aarch64-apple-darwin
            bundle_platform: darwin-arm64
            artifact_suffix: '-arm64'
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node (matches bundled runtime)
        uses: actions/setup-node@v4
        with:
          node-version-file: desktop/.node-version
          cache: pnpm

      # PIN the rustc version: dtolnay/rust-toolchain@stable would pull the
      # latest release on every run, and any rustc bump invalidates every
      # crate's fingerprint — the cargo cache below would be saved, restored,
      # and then ignored (full 45-min recompile anyway). 1.94.1 matches the
      # Windows build machine so behavior is predictable everywhere.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.target }}

      # Every run starts from a clean VM — without this the ~300-crate tauri
      # dep tree recompiles from scratch each time (30-45 min on the Intel
      # runner). Cache cargo registry + toolchain + the release target dir;
      # the key is stable across version bumps (Cargo.lock unchanged), so
      # rebuilds after a release version change still reuse compiled deps.
      # NOTE: ~/.rustup is arch-specific per job, which the matrix.target
      # key already accounts for.
      - name: Cache cargo (registry + toolchain + build artifacts)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            desktop/src-tauri/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.target }}-

      # fetch-node.cjs skips the ~27MB archive download when the binary
      # already exists — give it a persistent home so the download happens
      # once per .node-version, not once per run.
      - name: Cache bundled Node runtime
        uses: actions/cache@v4
        with:
          path: desktop/.sidecar-deps/runtime
          key: node-${{ matrix.bundle_platform }}-${{ hashFiles('desktop/.node-version') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WebUI
        run: cd ui && pnpm install --frozen-lockfile && pnpm build

      - name: Build server (root TS)
        run: pnpm build

      - name: Bundle sidecar deps (mac native binaries)
        run: cd desktop && OMA_TARGET_PLATFORM=${{ matrix.bundle_platform }} node scripts/bundle-deps.cjs

      - name: Fetch bundled Node runtime (mac)
        run: cd desktop && OMA_TARGET_PLATFORM=${{ matrix.bundle_platform }} node scripts/fetch-node.cjs

      # Signing secrets are OPTIONAL. Never set the env vars to empty
      # strings: tauri's codesign sees APPLE_CERTIFICATE set (even empty)
      # and runs `security import` on an empty file → build fails.
      - name: Configure signing env (only when secrets exist)
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_API_KEY }}" ]; then
            echo "APPLE_API_KEY=${{ secrets.APPLE_API_KEY }}" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=${{ secrets.APPLE_API_KEY_ID }}" >> "$GITHUB_ENV"
          fi

      - name: Build sidecar + Tauri app bundle
        # Timeout so a hung build fails fast and its full log becomes
        # downloadable for diagnosis. 90 min: the Intel runner is ~2x slower
        # than arm64 at the first (uncached) tauri compile; the cargo cache
        # above turns subsequent runs into mostly-link+package steps.
        # dmg is NOT built here — tauri's bundler drives Finder via
        # AppleScript (TCC automation grant), which hangs ~3 min then fails on
        # headless runners. The next step packages the dmg with hdiutil.
        timeout-minutes: 90
        run: cd desktop && npm run tauri:build:mac
        env:
          # beforeBuildCommand re-runs bundle-deps; keep the platform pruning
          # aligned with this job's target (default would be win32-x64).
          OMA_TARGET_PLATFORM: ${{ matrix.bundle_platform }}

      - name: Package dmg (hdiutil + prebuilt .DS_Store, no AppleScript)
        # tauri's bundler lays out the dmg (app icon + /Applications drop
        # target) by driving Finder via AppleScript, which needs a TCC
        # automation grant and hangs ~3 min then fails on headless runners.
        # Instead we replicate the Electron (electron-builder) dmg exactly:
        # its prebuilt .DS_Store template (app left, /Applications right,
        # 540x380 centered window) is committed at
        # desktop/scripts/dmg-layout/.DS_Store and copied into the staging
        # dir before hdiutil — no Finder, no extra dependencies.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP="desktop/src-tauri/target/release/bundle/macos/OhMyAgent.app"
          DMG_DIR="desktop/src-tauri/target/release/bundle/dmg"
          DMG="$DMG_DIR/OhMyAgent-${VERSION}${{ matrix.artifact_suffix }}.dmg"
          # The dmg dir accumulates stale files from previous runs via the
          # cargo target cache (bundle_dmg.sh, old-named dmg, icon.icns) —
          # start clean so only the fresh dmg exists.
          rm -rf "$DMG_DIR"
          mkdir -p "$DMG_DIR"
          STAGING="$(mktemp -d)"
          cp -R "$APP" "$STAGING/OhMyAgent.app"
          ln -s /Applications "$STAGING/Applications"
          cp desktop/scripts/dmg-layout/.DS_Store "$STAGING/.DS_Store"
          hdiutil create -volname "OhMyAgent" -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          rm -rf "$STAGING"
          ls -lh "$DMG"

      - name: Package zip distribution (ditto, preserves resource forks)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP="desktop/src-tauri/target/release/bundle/macos/OhMyAgent.app"
          ZIP="desktop/src-tauri/target/release/bundle/macos/OhMyAgent-${VERSION}${{ matrix.artifact_suffix }}-mac.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          ls -lh "$ZIP"

      - name: Smoke test (launch app binary, check /api/health)
        run: |
          APP="desktop/src-tauri/target/release/bundle/macos/OhMyAgent.app"
          BIN="$APP/Contents/MacOS/ohmyagent-desktop"
          "$BIN" > /tmp/oma-smoke.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 40); do
            if curl -sf -m 2 http://127.0.0.1:9191/api/health > /tmp/oma-health.json; then
              echo "health OK: $(cat /tmp/oma-health.json)"
              kill $APP_PID 2>/dev/null || true
              exit 0
            fi
            sleep 2
          done
          echo "health check failed; app log:"
          tail -40 /tmp/oma-smoke.log
          kill $APP_PID 2>/dev/null || true
          exit 1

      - name: Generate latest.yml metadata
        # release-meta.cjs writes latest.yml next to the dmg already; the
        # extra cp to the same path was a stale main-branch line that made
        # bash -e exit on "are identical (not copied)".
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DMG=$(ls desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          node desktop/scripts/release-meta.cjs "$DMG" "$VERSION"

      - name: Upload artifacts
        # One file only: the dmg. GitHub always packages downloads as zip,
        # so the user gets a zip containing exactly one dmg. The ditto zip
        # and latest.yml stay out of artifacts (Release assets carry them).
        uses: actions/upload-artifact@v4
        with:
          name: ohmyagent-mac-${{ matrix.bundle_platform }}
          path: desktop/src-tauri/target/release/bundle/dmg/OhMyAgent-*${{ matrix.artifact_suffix }}.dmg
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: (github.event_name == 'release' || github.event.inputs.version != '') && success()
        uses: softprops/action-gh-release@v2
        with:
          # Both arch jobs attach a latest.yml for the same tag — the later
          # upload wins (the updater only needs the dmg URL for display; the
          # Windows latest.yml is uploaded manually and overwrites this one).
          overwrite: true
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.version }}
          files: |
            desktop/src-tauri/target/release/bundle/dmg/OhMyAgent-*${{ matrix.artifact_suffix }}.dmg
            desktop/src-tauri/target/release/bundle/dmg/latest.yml
            desktop/src-tauri/target/release/bundle/macos/OhMyAgent-*${{ matrix.artifact_suffix }}-mac.zip
