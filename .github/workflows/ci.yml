name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger: GitHub's push event delivery has been unreliable
  # (2026-08-06 backlog); this keeps CI runnable without a push.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reject focused tests (.only)
        run: |
          if grep -rnE '\b(describe|it|test)\.only\(' tests --include='*.ts'; then
            echo "::error::Focused tests (.only) must not be committed"
            exit 1
          fi

      # No version input: pnpm/action-setup reads the packageManager field
      # (pnpm@10.30.3). Pinning version: 10 alongside it fails the action
      # with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install UI dependencies
        # No rename dance: ui/pnpm-workspace.yaml is what stops pnpm from
        # walking up to the root workspace, so ui/ installs its own
        # node_modules either way (`pnpm -C ui root` confirms both).
        run: pnpm -C ui install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # no-floating-promises / no-misused-promises are crash rules here:
      # src/index.ts turns any unhandled rejection into process.exit(1).
      - name: Lint
        run: pnpm lint

      # tests/ is compiled by tsconfig.test.json only, and never was before it
      # existed, so the backlog is real (~485 errors). Inventory, not gate:
      # flip `continue-on-error` off once it is cleared to make this blocking.
      - name: Typecheck tests (inventory)
        run: pnpm typecheck:tests
        continue-on-error: true

      - name: Test with coverage
        run: pnpm test:coverage

  desktop-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install desktop dependencies
        run: |
          # desktop/ deliberately has no pnpm-workspace.yaml of its own (unlike
          # ui/): it declares zero dependencies and `pnpm build:sidecar` below
          # resolves tsc through the *root* workspace's node_modules/.bin.
          # Hiding the root file makes the install standalone; the trap restores
          # it even when the install fails, so a later step can never run
          # against a half-renamed repository.
          mv pnpm-workspace.yaml pnpm-workspace.yaml.bak
          trap 'mv pnpm-workspace.yaml.bak pnpm-workspace.yaml' EXIT
          pnpm -C desktop install --frozen-lockfile

      - name: Build desktop sidecar
        run: pnpm -C desktop build:sidecar
