# Desktop Linux build — GitHub Actions CI (deb + AppImage).
#
# Mirrors desktop-windows.yml: bundle-deps, fetch-node and tauri build run
# with the same pinned rustc (1.94.1) so the cargo cache is interchangeable.
#
# Trigger: manual (workflow_dispatch) or when a release is published.

name: desktop-linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to attach release assets to (e.g. 2.2.0-beta1). Leave empty for artifact-only build.'
        required: false
  release:
    types: [published]

permissions:
  contents: write

env:
  OMA_TARGET_PLATFORM_PLACEHOLDER: ''

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node (matches bundled runtime)
        uses: actions/setup-node@v4
        with:
          node-version-file: desktop/.node-version
          cache: pnpm

      # Same rustc as the Windows/macOS workflows and the Windows build machine.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Cache cargo (registry + toolchain + build artifacts)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            desktop/src-tauri/target
          key: cargo-linux-x64-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-linux-x64-

      - name: Cache bundled Node runtime
        uses: actions/cache@v4
        with:
          path: desktop/.sidecar-deps/runtime
          key: node-linux-x64-${{ hashFiles('desktop/.node-version') }}

      # Tauri 2 system dependencies (WebKitGTK 4.1). libfuse2 is needed to
      # run appimagetool when packaging the AppImage.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            fakeroot \
            dpkg-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WebUI
        run: cd ui && pnpm install --frozen-lockfile && pnpm build

      - name: Build server (root TS)
        run: pnpm build

      - name: Bundle sidecar deps (linux-x64)
        run: cd desktop && OMA_TARGET_PLATFORM=linux-x64 node scripts/bundle-deps.cjs

      - name: Fetch bundled Node runtime (linux-x64)
        run: cd desktop && OMA_TARGET_PLATFORM=linux-x64 node scripts/fetch-node.cjs

      - name: Check version consistency (root / desktop / tauri.conf.json)
        run: |
          rootVer=$(node -p "require('./package.json').version")
          desktopVer=$(node -p "require('./desktop/package.json').version")
          tauriVer=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [ "$rootVer" != "$desktopVer" ] || [ "$rootVer" != "$tauriVer" ]; then
            echo "Version mismatch: root=$rootVer desktop=$desktopVer tauri.conf=$tauriVer"
            exit 1
          fi
          echo "Versions consistent: $rootVer"

      - name: Build Tauri app (deb + AppImage)
        run: cd desktop && npx tauri build --bundles deb,appimage
        env:
          # beforeBuildCommand re-runs bundle-deps; keep the platform pruning
          # aligned with this job's target (default would be win32-x64).
          OMA_TARGET_PLATFORM: linux-x64
          # CI runners have no FUSE; linuxdeploy's AppImage fails to run
          # unless extracted-and-run.
          APPIMAGE_EXTRACT_AND_RUN: '1'

      # Rename to the Electron-era asset names (OhMyAgent-<v>.AppImage,
      # ohmyagent-desktop_<v>_amd64.deb) so the release looks the same as
      # before the Tauri migration.
      - name: Rename artifacts (electron-builder style names)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd desktop/src-tauri/target/release/bundle
          mv -f deb/OhMyAgent_${VERSION}_amd64.deb "deb/ohmyagent-desktop_${VERSION}_amd64.deb"
          mv -f appimage/OhMyAgent_${VERSION}_amd64.AppImage "appimage/OhMyAgent-${VERSION}.AppImage"

      - name: Generate latest-linux.yml metadata
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DEB=$(ls desktop/src-tauri/target/release/bundle/deb/*.deb | head -1)
          node desktop/scripts/release-meta.cjs "$DEB" "$VERSION" latest-linux.yml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ohmyagent-linux-x64
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/latest-linux.yml
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: (github.event_name == 'release' || github.event.inputs.version != '') && success()
        uses: softprops/action-gh-release@v2
        with:
          overwrite: true
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.version }}
          files: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/latest-linux.yml
