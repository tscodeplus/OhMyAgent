name: Runner probe
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-latest, macos-15-intel, macos-13]
    runs-on: ${{ matrix.runner }}
    steps:
      - run: |
          echo "label=${{ matrix.runner }}"
          uname -m
          sw_vers
