# Desktop Windows build — GitHub Actions CI (NSIS installer + latest.yml).
#
# Mirrors desktop/scripts/build.ps1 (minus the local WSL sync): bundle-deps,
# fetch-node and tauri build run exactly as they do on the Windows machine,
# with the same pinned rustc (1.94.1) so the cache is interchangeable.
#
# Trigger: manual (workflow_dispatch) or when a release is published.

name: desktop-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to attach release assets to (e.g. 2.2.0-beta1). Leave empty for artifact-only build.'
        required: false
  release:
    types: [published]

# The repo default is read-only; the release attach step needs to upload
# assets and update the release (same as the old Electron desktop-release.yml).
permissions:
  contents: write

env:
  OMA_TARGET_PLATFORM_PLACEHOLDER: ''

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node (matches bundled runtime)
        uses: actions/setup-node@v4
        with:
          node-version-file: desktop/.node-version
          cache: pnpm

      # Same rustc as the macOS workflow and the Windows build machine.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Cache cargo (registry + toolchain + build artifacts)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            desktop/src-tauri/target
          key: cargo-win-x64-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-win-x64-

      - name: Cache bundled Node runtime
        uses: actions/cache@v4
        with:
          path: desktop/.sidecar-deps/runtime
          key: node-win32-x64-${{ hashFiles('desktop/.node-version') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WebUI
        run: cd ui && pnpm install --frozen-lockfile && pnpm build

      - name: Build server (root TS)
        run: pnpm build

      # bundle-deps / fetch-node default to win32-x64 (the host platform),
      # same as build.ps1 on the Windows machine.
      - name: Bundle sidecar deps (win32-x64)
        run: cd desktop && node scripts/bundle-deps.cjs

      - name: Fetch bundled Node runtime (win32-x64)
        run: cd desktop && node scripts/fetch-node.cjs

      - name: Check version consistency (root / desktop / tauri.conf.json)
        run: |
          $rootVer = (Get-Content "package.json" | ConvertFrom-Json).version
          $desktopVer = (Get-Content "desktop/package.json" | ConvertFrom-Json).version
          $tauriVer = (Get-Content "desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          if ($rootVer -ne $desktopVer -or $rootVer -ne $tauriVer) {
            throw "Version mismatch: root=$rootVer desktop=$desktopVer tauri.conf=$tauriVer"
          }
          echo "Versions consistent: $rootVer"

      - name: Build Tauri app (NSIS installer)
        run: cd desktop && npx tauri build --bundles nsis

      # tauri has no artifact-name config (removed in v2) — the NSIS file
      # comes out as OhMyAgent_<v>_x64-setup.exe. Rename to the Electron-era
      # OhMyAgent-Setup-<v>.exe so the updater's latest.yml URL keeps working.
      - name: Rename installer (electron-builder style name)
        run: |
          $VERSION = node -p "require('./package.json').version"
          $exe = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/OhMyAgent_*_x64-setup.exe" | Select-Object -First 1
          Rename-Item $exe.FullName "OhMyAgent-Setup-$VERSION.exe"

      - name: Generate latest.yml metadata
        run: |
          $VERSION = node -p "require('./package.json').version"
          $EXE = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/OhMyAgent-Setup-*.exe" | Select-Object -First 1
          node desktop/scripts/release-meta.cjs $EXE.FullName $VERSION

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ohmyagent-windows-x64
          path: desktop/src-tauri/target/release/bundle/nsis/OhMyAgent-Setup-*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: (github.event_name == 'release' || github.event.inputs.version != '') && success()
        uses: softprops/action-gh-release@v2
        with:
          # Overwrite the mac jobs' latest.yml: this one points at the NSIS
          # installer, which is what the Windows updater downloads.
          overwrite: true
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.version }}
          files: |
            desktop/src-tauri/target/release/bundle/nsis/OhMyAgent-Setup-*.exe
            desktop/src-tauri/target/release/bundle/nsis/latest.yml
